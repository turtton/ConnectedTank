[versions]
loader = "0.19.2"
loom = "1.15.5"
fabric-kotlin = "1.13.11+kotlin.2.3.21"
kotlin = "2.3.21"
spotless = "7.2.1"
mod-publish-plugin = "0.8.4"
neoforge-mc = "21.11.42"
neoforge-moddev = "2.0.141"
kff = "6.2.0"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "loader" }
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-kotlin" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "loom" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
mod-publish-plugin = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish-plugin" }
neoforge-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev" }
